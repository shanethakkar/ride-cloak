[project]
name = "ridecloak"
version = "0.1.0"
description = "Privacy-safe regulated trip-data sharing pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Shane Thakkar" }]

# Phase 0 dependency set. Later phases add their own via `uv add`:
#   Phase 1: pandera        Phase 2: presidio-analyzer, presidio-anonymizer, spacy
#   Phase 6: anthropic      Phase 8: matplotlib      (6b optional: streamlit)
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "faker>=30.0",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
]

[project.scripts]
ridecloak = "cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "config", "policies"]
# cli.py is a top-level module, not a package; force-include it into the wheel root.
force-include = { "cli.py" = "cli.py" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enable: pyflakes, pycodestyle, isort, bugbear, comprehensions, pyupgrade, naming.
select = ["F", "E", "W", "I", "B", "C4", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
